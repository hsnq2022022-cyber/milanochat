name: Flow publishing API and atomic revision tests

on:
  push:
    branches: [feature/flows-live-publication-api]
  pull_request:
    paths:
      - "src/flow/serverPublicationValidation*"
      - "supabase/functions/flow-publication/**"
      - "supabase/migrations/20261028190000_flow_publication_server_rpcs.sql"
      - "supabase/rollbacks/20261028190000_flow_publication_server_rpcs.rollback.sql"
      - "tests/sql/flow-publication-live.test.sql"
      - ".github/workflows/flow-publication-ci.yml"

permissions:
  contents: read

jobs:
  publication-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_publishing_only
          POSTGRES_DB: flow_pub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d flow_pub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: synthetic_publishing_only
      PGDATABASE: flow_pub_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic real-shaped tenants and channels
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-live-shape-bootstrap.sql
      - name: Install OFF switches and tenant-bound runtime only in PostgreSQL CI
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028170000_automation_flow_switches.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028180000_flow_runtime_tenant_bound.sql
      - name: Create atomic publication, activation and rollback RPCs
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028190000_flow_publication_server_rpcs.sql
      - name: Install proposed rate limiter in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028200000_flow_publication_rate_limit.sql
      - name: Test atomic tenant budget and protected privileges
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-rate-limit.test.sql
      - name: Two independent PostgreSQL clients race on the same tenant budget
        shell: bash
        run: |
          set -euo pipefail
          # The synthetic fixture omits production's existing service_role grants.
          psql -X -v ON_ERROR_STOP=1 -c "GRANT SELECT ON public.tenants TO service_role"
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-rate-parallel.sql > /tmp/rate-left.out &
          left=$!
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-rate-parallel.sql > /tmp/rate-right.out &
          right=$!
          wait "$left"
          wait "$right"
          accepted="$(cat /tmp/rate-left.out /tmp/rate-right.out | grep -cx '1' || true)"
          denied="$(cat /tmp/rate-left.out /tmp/rate-right.out | grep -cx '0' || true)"
          test "$accepted" = "30"
          test "$denied" = "10"
          counter="$(psql -XAtq -c "SELECT request_count FROM public.flow_publication_rate_windows WHERE tenant_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' AND window_start=date_trunc('minute',now())")"
          test "$counter" = "30"
          echo "PASS: two concurrent DB sessions: 30 accepted, 10 denied, counter=30"
      - name: Verify owner isolation, immutable revisions, canary, deactivation and privileges
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-live.test.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/verification/20261028190000_flow_publication_server_rpcs.readonly.sql
      - name: Test two-tenant RPC isolation without persisting fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-two-tenant.test.sql
      - name: Parallel publishers cannot allocate duplicate revision numbers
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.channel_accounts SET is_active=true WHERE id='11111111-1111-4111-8111-111111111111'"
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-concurrent.sql > /tmp/publish-one.out &
          one=$!
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-publication-concurrent.sql > /tmp/publish-two.out &
          two=$!
          wait "$one"
          wait "$two"
          cat /tmp/publish-one.out /tmp/publish-two.out
          test "$(cat /tmp/publish-one.out /tmp/publish-two.out | grep -cx '1')" = "1"
          test "$(cat /tmp/publish-one.out /tmp/publish-two.out | grep -cx '2')" = "1"
          result="$(psql -XAtq -c "SELECT count(*)||'|'||min(revision)||'|'||max(revision) FROM public.automation_flow_publications WHERE flow_key='concurrent'")"
          test "$result" = "2|1|2"
          echo "PASS: two concurrent publishers produced distinct immutable revisions"
      - name: Harden legacy service-only RPCs in synthetic PostgreSQL and test trigger
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/legacy-rpc-security-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028210000_harden_widget_human_rpc_acl.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/legacy-rpc-security.test.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261028210000_harden_widget_human_rpc_acl.rollback.sql
          echo "PASS: legacy ACL hardened then restored on disposable DB only"
      - name: Rollback disables only the management RPCs, retaining versions
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261028190000_flow_publication_server_rpcs.rollback.sql
          test "$(psql -XAtq -c "SELECT to_regprocedure('public.flow_publish_revision(uuid,uuid,text,text,uuid,jsonb)') IS NULL")" = "t"
          test "$(psql -XAtq -c "SELECT count(*) FROM public.automation_flow_publications")" = "4"
          echo 'PASS: RPC-only rollback preserved historical published revisions'

  publication-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax-check protected live smoke script (no credentials, no deployment)
        run: node --check scripts/flow-publication-live-smoke.mjs
      - name: Test graph, channel and server-only activation guard
        run: node --experimental-strip-types --test src/flow/serverPublicationValidation.test.ts
      - name: Typecheck flow modules
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Build frontend
        run: npm run build
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: HTTP integration with two users, expired JWT and 429
        run: deno test --allow-net --allow-env --node-modules-dir=auto tests/flow-publication-http.test.ts
      - name: Deno check real (not deployed) publication Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/flow-publication/index.ts
