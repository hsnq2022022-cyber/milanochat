name: Flow Builder CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  types-unit-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck all application and tests
        run: npm run typecheck
      - name: All Node unit tests
        run: npm run test:unit
      - name: Vite production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser acceptance tests
        env:
          VITE_ENABLE_CLOUD_FLOW_DRAFTS: "true"
        run: npm run test:browser
      - name: Upload browser screenshots and traces as QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flows-browser-evidence
          path: test-results/
          if-no-files-found: ignore

  flow-schema-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_flow_ci_only
          POSTGRES_DB: flow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: isolated_flow_ci_only
      PGDATABASE: flow_ci
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap two synthetic tenant owners
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-drafts-bootstrap.sql
      - name: Apply draft schema to disposable Postgres
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/automation_flow_drafts.review.sql
      - name: Verify tenant A/B, anonymous, revisions and limits
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-drafts-rls.test.sql

  atomic-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fake_ci_only
          POSTGRES_DB: flow_atomic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flow_atomic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fake_ci_only
      PGDATABASE: flow_atomic_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated schema, synthetic roles, defaults and private reserve function
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-atomic-staging-bootstrap.sql
      - name: Verify atomics, tenant isolation, trigger guards and private grants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-atomic-staging.test.sql
      - name: Test two truly concurrent database sessions processing the same Meta event
        shell: bash
        run: |
          set -euo pipefail
          psql -XAtq -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT flow_ci.reserve_inbound(
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'cccccccc-cccc-4ccc-8ccc-cccccccccccc','instagram',
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
            'welcome',1,'evt-concurrent',
            '10000000-0000-4000-8000-000000000101',
            '20000000-0000-4000-8000-000000000101',
            '30000000-0000-4000-8000-000000000101',
            'effect-concurrent','start','{\"text\":\"concurrent\"}'::jsonb,true
          );" > /tmp/worker1.out &
          p1=$!
          psql -XAtq -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT flow_ci.reserve_inbound(
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'cccccccc-cccc-4ccc-8ccc-cccccccccccc','instagram',
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
            'welcome',1,'evt-concurrent',
            '10000000-0000-4000-8000-000000000102',
            '20000000-0000-4000-8000-000000000102',
            '30000000-0000-4000-8000-000000000102',
            'effect-concurrent','start','{\"text\":\"concurrent\"}'::jsonb,true
          );" > /tmp/worker2.out &
          p2=$!
          wait "$p1"
          wait "$p2"
          echo "Worker results:"
          cat /tmp/worker1.out /tmp/worker2.out
          test "$(cat /tmp/worker1.out /tmp/worker2.out | grep -cx 't')" -eq 1
          test "$(cat /tmp/worker1.out /tmp/worker2.out | grep -cx 'f')" -eq 1
          counts="$(psql -XAtq -v ON_ERROR_STOP=1 -c "
            SELECT (SELECT count(*) FROM flow_ci.receipts WHERE event_id='evt-concurrent')
              || '|' || (SELECT count(*) FROM flow_ci.runs WHERE event_id='evt-concurrent')
              || '|' || (SELECT count(*) FROM flow_ci.outbox WHERE effect_key='effect-concurrent');
          ")"
          echo "receipt|run|outbox counts: $counts"
          test "$counts" = "1|1|1"
