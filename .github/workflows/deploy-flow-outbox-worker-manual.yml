name: PROTECTED MANUAL — flow-outbox-worker only

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type deploy-flow-outbox-worker-reviewed after separate production approval"
        required: true
        type: string
        default: "NOT_APPROVED"
      dry_run:
        description: "true = bundle remotely with bundleOnly (nothing persisted); false = deploy"
        required: true
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: protected-supabase-nmhefwvhoholcjrbbila
  cancel-in-progress: false

jobs:
  deploy-flow-outbox-worker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'deploy-flow-outbox-worker-reviewed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: protected-supabase-flow-release
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nmhefwvhoholcjrbbila
      EXPECTED_BASE: 4c7f88b66e7878d6e86eea8c103adb2c383fcf2a
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact release scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hsnq2022022-cyber/milanochat"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -f supabase/functions/flow-outbox-worker/index.ts
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          # Function sources and deploy script must be identical to the reviewed revision.
          git diff --quiet "$EXPECTED_BASE" HEAD -- supabase/functions scripts/deploy-functions.js
          case "${{ inputs.dry_run }}" in true|false) ;; *) echo "dry_run must be true or false"; exit 1;; esac
          echo "Manual release approved for flow-outbox-worker only (dry_run=${{ inputs.dry_run }})"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dry run (flow-outbox-worker only)
        if: ${{ inputs.dry_run == 'true' }}
        shell: bash
        run: node scripts/deploy-functions.js --only flow-outbox-worker --dry-run
      - name: Deploy flow-outbox-worker only
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        run: node scripts/deploy-functions.js --only flow-outbox-worker
