# نشر تلقائي إلى GitHub Pages عند كل push إلى main
# تفعيله مرة واحدة من: Settings → Pages → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
        # متغيرات البناء (VITE_*) — تُخبز داخل الموقع عند البناء.
        # المفتاح anon عام ومخصص للمتصفح، فلا مشكلة من وجوده هنا.
        env:
          VITE_API_URL: https://milanochat-production.up.railway.app
          VITE_SUPABASE_URL: https://bjcflubrgswfqhufiwub.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqY2ZsdWJyZ3N3ZnFodWZpd3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDkwMjgsImV4cCI6MjEwNDEyNTAyOH0.9x5A8AsmyecXFbW8nn-oP8vO07cOJhDiga0WYCzzN7w

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
