name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    # Deploy the Vite site only when inputs to the deployed frontend change.
    # Deliberately exclude workflow-only, SQL-only and Edge-only commits.
    paths:
      - "src/**"
      # Test-only changes do not affect the deployed Vite bundle.
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "public/**"
      - "*.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production Pages must not publish an unverified Flow Builder bundle.
      # Only local, isolated checks: no Supabase secrets or provider sends.
      - name: Verify flow TypeScript and regression tests before publishing
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit -p tsconfig.flows.json
          npm run test:flows
          node --experimental-strip-types --test tests/flow-manage-existing-publications.test.ts
          node --experimental-strip-types --test tests/flow-live-two-choice-canary.test.ts

      # Execute existing mobile RTL and editor acceptance before publishing.
      # The Playwright server has no production credentials and never sends Meta messages.
      - name: Install Chromium for mobile acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify real editor interactions in browser
        run: npx playwright test -c playwright.config.ts tests/flow-mobile-locale.spec.ts

      # ✅ تحقق: هل ملف الشعار موجود فعلًا في public/؟
      - name: Verify logo.png exists
        run: |
          if [ ! -f "public/logo.png" ]; then
            echo "❌ public/logo.png not found!"
            echo "Files in public/:"
            ls -la public/ || echo "(public/ folder missing)"
            exit 1
          fi
          echo "✅ public/logo.png found"
          file public/logo.png
          du -h public/logo.png

      # ✅ تحقق: هل vite.config يحتوي على base صحيح؟
      - name: Verify vite.config base
        run: |
          if ! grep -q "milanochat" vite.config.* 2>/dev/null; then
            echo "⚠️  تحذير: لم أجد 'milanochat' في vite.config.ts/js"
            echo "تأكد من إضافة: base: '/milanochat/'"
          else
            echo "✅ base موجود في vite.config"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_ENABLE_CLOUD_FLOW_DRAFTS: "true"
          VITE_SUPABASE_URL: https://nmhefwvhoholcjrbbila.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5taGVmd3Zob2hvbGNqcmJiaWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDQxODgsImV4cCI6MjEwNDE4MDE4OH0.ALjKCHUjCfoxW0HJdz3EwL6JIEcc6OYXPucLP9un5j8

      # ✅ تحقق: هل logo.png وصل إلى dist/ بعد البناء؟
      - name: Verify logo.png in build output
        run: |
          if [ ! -f "dist/logo.png" ]; then
            echo "❌ dist/logo.png not found — لن تظهر الصورة في الموقع!"
            echo "محتوى dist/:"
            ls -la dist/
            exit 1
          fi
          echo "✅ dist/logo.png موجود وجاهز للنشر"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
