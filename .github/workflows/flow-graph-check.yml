name: Flow Graph Checks
on:
  push:
    branches: [flow-stage-3-1-instagram-events, flow-engine-safe-prototype]
    paths:
      - 'supabase/functions/milan-api/flow-graph.ts'
      - 'supabase/functions/milan-api/flow-graph.test.ts'
      - 'supabase/functions/milan-api/flow-interpreter.ts'
      - 'supabase/functions/milan-api/flow-interpreter.test.ts'
      - '.github/workflows/flow-graph-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck flow graph module
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --allowImportingTsExtensions --lib ES2022,DOM supabase/functions/milan-api/flow-graph.ts supabase/functions/milan-api/flow-interpreter.ts
      - name: Run graph tests
        run: node --experimental-strip-types --test supabase/functions/milan-api/flow-graph.test.ts supabase/functions/milan-api/flow-interpreter.test.ts
