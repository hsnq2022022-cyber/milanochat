name: Deploy Supabase Edge Functions

# ينشر دوال Supabase تلقائياً عند أي تعديل داخل supabase/functions
# يتطلب سراً واحداً في GitHub: SUPABASE_ACCESS_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret)

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nmhefwvhoholcjrbbila

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "⚠️ SUPABASE_ACCESS_TOKEN غير مضبوط في GitHub Secrets — تخطي النشر."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.token.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # verify_jwt مضبوط على false لهذه الدوال في المشروع، ونحافظ على نفس السلوك
      - name: Deploy milan-api
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy milan-api --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy channels
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy channels --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy agent-prompt
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy agent-prompt --project-ref "$PROJECT_REF" --no-verify-jwt
