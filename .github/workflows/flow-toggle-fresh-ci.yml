name: Omnichannel Flow Builder validation

on:
  push:
    branches: [feature/flow-toggle-fresh-start, feature/flows-batch1-validation]
    paths:
      - "src/flow/**"
      - "src/pages/FlowBuilder.tsx"
      - "src/pages/Dashboard.tsx"
      - "src/components/SafeAvatar.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.flows.json"
      - "tests/flow-editor.spec.ts"
      - "tests/generate-flow-main-fixtures.ts"
      - "tests/flow-main-compat.test.ts"
      - "tests/fixtures/**"
      - "playwright.config.ts"
      - ".github/workflows/flow-toggle-fresh-ci.yml"
  workflow_dispatch:

concurrency:
  group: flow-toggle-fresh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate dependency lock deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript check of the isolated editor
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Prepare frozen main golden fixtures (first run only)
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          if [ ! -f tests/fixtures/flow-main-compat.json ]; then
            node --experimental-strip-types tests/generate-flow-main-fixtures.ts
          fi
      - name: Model and golden compatibility tests
        run: |
          npm run test:flows
          node --experimental-strip-types --test tests/flow-main-compat.test.ts
      - name: Production build
        run: npm run build
      - name: Install Chromium for interaction tests
        run: npx playwright install chromium
      - name: Browser edge and node editing acceptance
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-editor-browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Commit lockfile from tested build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tests/fixtures/flow-main-compat.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock tested React Flow editor dependencies"
            git reset --hard HEAD
            git fetch origin feature/flows-batch1-validation
            git rebase origin/feature/flows-batch1-validation
            git push origin HEAD:feature/flows-batch1-validation
          fi
