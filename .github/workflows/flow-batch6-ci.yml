name: Flow Builder Batch 6 - Mobile Accessibility

on:
  push:
    branches: [feature/flows-batch6-mobile-accessibility]
    paths:
      - "src/flow/**"
      - "src/pages/FlowBuilder.tsx"
      - "tests/flow-editor.spec.ts"
      - "tests/flow-runtime-audit.spec.ts"
      - "tests/flow-mobile-locale.spec.ts"
      - ".github/workflows/flow-batch6-ci.yml"
  workflow_dispatch:

concurrency:
  group: flow-batch6-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install fixed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Flow and simulator regression tests
        run: |
          npm run test:flows
          node --experimental-strip-types --test src/flow/simulation.test.ts
      - name: Immutable importer fixtures
        run: node --experimental-strip-types --test tests/flow-main-compat.test.ts
      - name: Production build
        run: npm run build
      - name: Chromium installation
        run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-batch6-browser-evidence
          path: test-results/
          if-no-files-found: ignore
