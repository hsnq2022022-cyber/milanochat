name: Stage 3 Widget billing and delivery reconciliation — synthetic PostgreSQL

on:
  push:
    branches: [feature/flow-widget-credit-delivery-reconciliation]
  pull_request:
    paths:
      - "supabase/functions/milan-api/**"
      - "supabase/migrations/2026102822*.sql"
      - "tests/sql/flow-exclusive*"
      - "tests/flow-exclusive-claim.test.ts"
      - "tests/flow-credit-delivery.test.ts"
      - "supabase/migrations/20261028223*.sql"
      - "supabase/migrations/20261028224*.sql"
      - "tests/sql/flow-widget*"
      - "tests/sql/flow-delivery*"
      - ".github/workflows/flow-exclusive-claim-ci.yml"

permissions:
  contents: read

jobs:
  claim-and-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: exclusive_claim_ci_only
          POSTGRES_DB: claim_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d claim_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: exclusive_claim_ci_only
      PGDATABASE: claim_ci
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic schema with real tenant/account/flow shapes
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/fixtures/flow-live-shape-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/fixtures/installed-flow-switches.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/fixtures/installed-flow-runtime.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-exclusive-claim-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-widget-delivery-bootstrap.sql
      - name: Install claim and atomic billing proposals only in disposable PG
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028220000_webhook_exclusive_claim.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028221000_consume_reply_atomic.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028223000_widget_reply_credit.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261028224000_delivery_attempts.sql
      - name: OFF, engine failure, duplication, account isolation, flow and one debit
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-exclusive-claim.test.sql
      - name: Real concurrency — exactly one winner across two database clients
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.messages(id,tenant_id,conversation_id,direction,wa_message_id) VALUES('77777777-7777-4777-8777-777777777774','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','44444444-4444-4444-8444-444444444444','in','meta-concurrent')"
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-exclusive-concurrent.sql > /tmp/claim-first &
          first=$!
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-exclusive-concurrent.sql > /tmp/claim-second &
          second=$!
          wait "$first"
          wait "$second"
          echo "First claimant:"; cat /tmp/claim-first
          echo "Second claimant:"; cat /tmp/claim-second
          test "$(cat /tmp/claim-first /tmp/claim-second | grep -cx 'won')" = 1
          test "$(cat /tmp/claim-first /tmp/claim-second | grep -cx 'lost')" = 1
          test "$(psql -XAtq -c "SELECT count(*) FROM public.automation_message_claims WHERE provider_event_id='meta-concurrent'")" = 1
          echo "PASS: two clients; 1 acquired; 1 duplicate; 1 durable claim"
      - name: Widget credit: ownership, duplicate, zero credit and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-widget-credit.test.sql
      - name: Race same Widget message through two PostgreSQL sessions
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.tenants SET credits_remaining=5 WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'"
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-widget-credit-concurrent.sql > /tmp/widget-a &
          a=$!
          psql -XAtq -v ON_ERROR_STOP=1 -f tests/sql/flow-widget-credit-concurrent.sql > /tmp/widget-b &
          b=$!
          wait "$a"
          wait "$b"
          test "$(cat /tmp/widget-a /tmp/widget-b | grep -cx '4')" = 1
          test "$(cat /tmp/widget-a /tmp/widget-b | grep -cx '-2')" = 1
          test "$(psql -XAtq -c "SELECT count(*) FROM public.widget_reply_ledger WHERE widget_message_id='a0000000-0000-4000-8000-000000000007'")" = 1
          echo "PASS: two PostgreSQL clients; one Widget debit 5->4; one retry -2; one ledger"
      - name: Delivery attempts: confirmed, uncertain and human review
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-delivery-reconciliation.test.sql
      - name: Guarded Widget/delivery rollback refuses existing charges/attempts
        shell: bash
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261028223000_widget_reply_credit.rollback.sql >/tmp/wrollback.log 2>&1; then exit 1; fi
          if psql -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261028224000_delivery_attempts.rollback.sql >/tmp/drollback.log 2>&1; then exit 1; fi
          echo "PASS: nonempty credit/delivery history cannot be discarded by rollback"
      - name: Guarded rollback must reject nonempty durable claims
        shell: bash
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261028220000_webhook_exclusive_claim.rollback.sql > /tmp/claim-rollback.log 2>&1; then
            echo "FAIL: rollback deleted durable claim history";exit 1
          fi
          test "$(psql -XAtq -c "SELECT count(*) FROM public.automation_message_claims WHERE provider_event_id='meta-concurrent'")" = 1
          echo "PASS: guarded rollback kept durable duplicate claims"

  webhook-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exclusive owner, duplicated event, concurrent requests and fallback
        run: |
          node --experimental-strip-types --test tests/flow-exclusive-claim.test.ts
          node --experimental-strip-types --test tests/flow-credit-delivery.test.ts
          node --check scripts/flow-delivery-reconcile.mjs
      - name: Meta signature and legacy shadow regression
        run: |
          node --experimental-strip-types --test tests/meta-signature.test.ts
          node --experimental-strip-types --test tests/whatsapp-signature.test.ts
          node --experimental-strip-types --test tests/legacy-inbound-insert.test.ts
          node --experimental-strip-types --test tests/flow-shadow-gate.test.ts
          node --experimental-strip-types --test tests/flow-shadow-integration.test.ts
      - name: Frontend Vite build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Deno typecheck actual milan-api and new helpers
        run: |
          deno check supabase/functions/milan-api/exclusiveMessageClaim.ts
          deno check supabase/functions/milan-api/flowPrepareMessage.ts
          deno check supabase/functions/milan-api/widgetCredit.ts
          deno check --node-modules-dir=auto supabase/functions/milan-api/index.ts
      - name: Source-level integration guards
        run: |
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const s=readFileSync("supabase/functions/milan-api/index.ts","utf8");
          for(const anchor of ["verifyMetaWebhookSignature(raw,sigHeader",
             "const whatsappSignatureValid = await verifyMetaWebhookSignature(",
             "const incomingResult = await persistInboundOnce(",
             "await processExclusiveEvent(","p_message_id: outgoingId",
             "p_provider_event_id: externalMsgId"]) if(!s.includes(anchor))
               throw Error("REQUIRED_ROUTE_MISSING: "+anchor);
          console.log("PASS: candidate integrates signed webhooks, atomic claim and billing");
          '
