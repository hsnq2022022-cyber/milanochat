name: Flow CI baseline probe (temporary)
on:
  push:
    branches: [chore/ci-and-typecheck]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture strict typecheck baseline (do not suppress regressions in release)
        run: npm run typecheck 2>&1 | tee /tmp/typecheck-baseline.txt; true
      - name: Resolve exact lockfile metadata for Node 22 types (never commit from CI)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev @types/node@22.15.29
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            for (const k of ["node_modules/@types/node","node_modules/undici-types"]) console.log("LOCK_METADATA "+k+" "+JSON.stringify(p.packages[k]));
            console.log("LOCK_ROOT_TYPES "+p.packages[""].devDependencies["@types/node"]);
          '
