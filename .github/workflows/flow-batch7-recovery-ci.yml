name: Flow Builder Batch 7 - Safe Cloud Reconciliation

on:
  push:
    branches: [feature/flows-batch7-recovery-reconciliation]
    paths:
      - "src/flow/**"
      - "supabase/proposals/automation_flow_drafts.review.sql"
      - "docs/flow-branch-reconciliation.md"
      - ".github/workflows/flow-batch7-recovery-ci.yml"
  workflow_dispatch:

concurrency:
  group: flow-batch7-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install unchanged lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Existing flow, simulator, cloud and recovery tests
        run: |
          npm run test:flows
          node --experimental-strip-types --test src/flow/simulation.test.ts
          node --experimental-strip-types --test src/flow/cloudDraft.test.ts
          node --experimental-strip-types --test src/flow/cloudRecovery.test.ts
          node --experimental-strip-types --test src/flow/cloudDraftSqlReview.test.ts
      - name: Frozen importer fixture compatibility
        run: node --experimental-strip-types --test tests/flow-main-compat.test.ts
      - name: Production build
        run: npm run build
      - name: Chromium install
        run: npx playwright install chromium
      - name: Browser acceptance
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-batch7-recovery-browser-evidence
          path: test-results/
          if-no-files-found: ignore
