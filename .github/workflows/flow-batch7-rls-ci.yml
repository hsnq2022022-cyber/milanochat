name: Flow Builder Batch 7 - Isolated PostgreSQL RLS

on:
  push:
    branches:
      - feature/flows-batch7-isolated-rls-verification
    paths:
      - "tests/sql/flow-drafts-*.sql"
      - "supabase/proposals/automation_flow_drafts.review.sql"
      - ".github/workflows/flow-batch7-rls-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: flow_rls_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flow_rls_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: flow_rls_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Supabase-like auth schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-drafts-bootstrap.sql
      - name: Apply proposal to disposable CI database only
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/proposals/automation_flow_drafts.review.sql
      - name: Assert cross-tenant RLS and SQL grants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/flow-drafts-rls.test.sql
