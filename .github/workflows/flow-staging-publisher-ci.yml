name: Flow staging publisher contract

on:
  push:
    branches: [feature/flows-staging-publisher]
  pull_request:
    paths:
      - "src/flow/stagingPublisher.ts"
      - "src/flow/stagingPublisher.test.ts"
      - ".github/workflows/flow-staging-publisher-ci.yml"

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full TypeScript check
        run: npm run typecheck
      - name: Publishing gate and revision tests
        run: |
          node --experimental-strip-types --test src/flow/stagingPublisher.test.ts
          node --experimental-strip-types --test src/flow/publicationGate.test.ts
      - name: Vite build
        run: npm run build
