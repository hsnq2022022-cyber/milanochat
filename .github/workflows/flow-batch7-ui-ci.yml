name: Flow Builder Batch 7 - Cloud UI Preview

on:
  push:
    branches:
      - feature/flows-batch7-optin-cloud-ui
    paths:
      - "src/flow/**"
      - "src/pages/FlowBuilder.tsx"
      - "tests/flow-cloud-ui.spec.ts"
      - ".github/workflows/flow-batch7-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Flow and cloud adapter tests
        run: |
          npm run test:flows
          node --experimental-strip-types --test src/flow/cloudDraft.test.ts
          node --experimental-strip-types --test src/flow/simulation.test.ts
          node --experimental-strip-types --test tests/flow-main-compat.test.ts
      - name: Production build with cloud feature OFF by default
        run: npm run build
      - name: Chromium installation
        run: npx playwright install chromium
      - name: Browser acceptance with cloud preview explicitly enabled
        env:
          VITE_ENABLE_CLOUD_FLOW_DRAFTS: "true"
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ui-browser-failures
          path: test-results/
          if-no-files-found: ignore
