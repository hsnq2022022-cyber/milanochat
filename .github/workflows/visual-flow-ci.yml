name: Visual Flow Builder validation

on:
  push:
    branches: [feature/visual-flow-reactflow]
    paths:
      - "src/flow/**"
      - "src/pages/FlowBuilder.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.flows.json"
      - "tests/flow-editor.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/visual-flow-ci.yml"
  workflow_dispatch:

concurrency:
  group: visual-flow-editor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate dependency lock deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript check of the isolated editor
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Model acceptance tests
        run: npm run test:flows
      - name: Production build
        run: npm run build
      - name: Install Chromium for interaction tests
        run: npx playwright install chromium
      - name: Browser edge and node editing acceptance
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-editor-browser-evidence
          path: test-results/
          if-no-files-found: ignore
      - name: Commit lockfile from tested build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock tested React Flow editor dependencies"
            git fetch origin feature/visual-flow-reactflow
            git rebase origin/feature/visual-flow-reactflow
            git push origin HEAD:feature/visual-flow-reactflow
          fi
