name: Flow shadow mode is non-disruptive

on:
  push:
    branches: [feature/flows-legacy-ai-shadow-gate]
  pull_request:
    paths:
      - "supabase/functions/milan-api/flowShadowGate.ts"
      - "supabase/functions/milan-api/index.ts"
      - "tests/flow-shadow-*.test.ts"
      - ".github/workflows/flow-shadow-gate-ci.yml"

permissions:
  contents: read

jobs:
  legacy-ai-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: No-op gate and integration contract tests
        run: |
          node --experimental-strip-types --test tests/flow-shadow-gate.test.ts
          node --experimental-strip-types --test tests/flow-shadow-integration.test.ts
      - name: Flow-module typecheck (full legacy app check is tracked by PR #117)
        run: npx tsc --noEmit -p tsconfig.flows.json
      - name: Vite build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Check pure gate under Supabase Deno runtime
        run: deno check supabase/functions/milan-api/flowShadowGate.ts
