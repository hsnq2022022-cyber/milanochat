<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061A14">
<title>إدارة سوشيال — نموذج محرر التدفقات</title>

<!-- Fonts: Lalezar (vintage display, Arabic) with Aref Ruqaa fallback; Tajawal for UI text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- Tailwind via CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: { extend: {
      colors: { ink:'#061A14', card:'#0B241C', field:'#0F2E24', line:'#173D30', brand:'#3DD189', muted:'#8B9E96', gold:'#E5B54B', danger:'#F45B69' },
      fontFamily: { display:['Lalezar','"Aref Ruqaa"','serif'], sans:['Tajawal','system-ui','sans-serif'] }
    } }
  }
</script>

<style>
  :root{
    --bg:#061A14; --card:#0B241C; --field:#0F2E24; --line:#173D30;
    --brand:#3DD189; --text:#FFFFFF; --muted:#8B9E96; --gold:#E5B54B; --danger:#F45B69;
    --insp-w:392px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;color:inherit}
  svg{display:block}
  .display{font-family:'Lalezar','Aref Ruqaa',serif;font-weight:400;letter-spacing:.2px}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}

  .app{display:flex;flex-direction:column;height:100dvh}

  /* ---------- Top bar ---------- */
  .topbar{position:relative;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(6,26,20,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .tb-main{display:flex;align-items:center;gap:10px}
  .ibtn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;color:var(--muted);transition:background .2s,color .2s,transform .15s}
  .ibtn:hover{background:var(--field);color:var(--text)}
  .ibtn:active{transform:scale(.94)}
  .ibtn[disabled]{opacity:.35;pointer-events:none}
  .tb-name{flex:1;min-width:0;display:flex;flex-direction:column}
  .tb-cap{font-size:11px;color:var(--muted);padding-inline:10px;line-height:1.2}
  .name-input{width:100%;background:transparent;border:1px solid transparent;border-radius:10px;padding:2px 10px;
    font-family:'Lalezar','Aref Ruqaa',serif;font-size:21px;line-height:1.35;color:var(--text);text-overflow:ellipsis}
  .name-input:hover{border-color:var(--line)}
  .name-input:focus{outline:none;border-color:var(--brand);background:var(--field)}
  .tb-toggle svg{transition:transform .3s var(--ease)}
  .topbar.collapsed .tb-toggle svg{transform:rotate(180deg)}
  .tb-sub-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--ease)}
  .topbar.collapsed .tb-sub-wrap{grid-template-rows:0fr}
  .tb-sub{overflow:hidden;min-height:0}
  .tb-sub-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(61,209,137,.18);transition:background .2s}
  .status.saving .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(229,181,75,.2);animation:blink .9s infinite}
  .grp{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px}
  .grp .ibtn{width:38px;height:38px;border-radius:11px}
  .chip-warn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--danger);
    background:rgba(244,91,105,.1);border:1px solid rgba(244,91,105,.35)}
  .chip-warn[hidden]{display:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;font-weight:700;font-size:14.5px;transition:transform .15s,box-shadow .2s,background .2s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{border:1px solid var(--line);color:var(--text);background:var(--card)}
  .btn.ghost:hover{background:var(--field)}
  .btn.primary{background:var(--brand);color:#04130d;box-shadow:0 8px 24px -8px rgba(61,209,137,.65)}
  .btn.primary:hover{box-shadow:0 10px 30px -6px rgba(61,209,137,.85)}
  .btn.danger{border:1px solid rgba(244,91,105,.4);color:var(--danger);background:rgba(244,91,105,.08)}
  .tb-sub-in .push{margin-inline-start:auto;display:flex;gap:8px}

  /* ---------- Stage / canvas ---------- */
  .stage-wrap{flex:1;min-height:0;position:relative;transition:margin .35s var(--ease)}
  .stage{position:absolute;inset:0;overflow:hidden;overflow:clip;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
    background-color:var(--bg);
    background-image:radial-gradient(circle, var(--line) 1.3px, transparent 1.6px);background-size:22px 22px}
  .stage.grabbing{cursor:grabbing}
  .stage.smooth{transition:background-position .38s var(--ease)}
  .stage.smooth .world{transition:transform .38s var(--ease)}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 60% at 70% 30%, rgba(61,209,137,.07), transparent 70%), radial-gradient(120% 90% at 50% 120%, rgba(0,0,0,.45), transparent 60%)}
  .world{position:absolute;left:0;top:0;width:1900px;height:640px;transform-origin:0 0;direction:ltr;will-change:transform}
  #wires{position:absolute;left:0;top:0;width:1900px;height:640px;overflow:visible;pointer-events:none}
  .wire-flow{stroke-dasharray:2 14;stroke-linecap:round;animation:flow 1.1s linear infinite}

  /* ---------- Nodes ---------- */
  .node{position:absolute;width:244px;direction:rtl;border-radius:20px;padding:14px 14px 14px;cursor:pointer;
    background:linear-gradient(180deg,#0E2B22 0%,var(--card) 100%);border:1px solid var(--line);
    box-shadow:0 14px 34px -14px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.045);
    transition:box-shadow .25s,border-color .25s,transform .2s;touch-action:none}
  .node::before{content:"";position:absolute;inset-inline:18px;top:0;height:3px;border-radius:0 0 6px 6px;background:var(--c);opacity:.9;box-shadow:0 0 14px var(--c)}
  .node:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
  .node.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent), 0 20px 48px -12px color-mix(in srgb,var(--c) 38%,transparent)}
  .node.dragging{transform:scale(1.02);z-index:5}
  .nd-head{display:flex;align-items:center;gap:11px}
  .nd-ico{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--c);
    background:color-mix(in srgb,var(--c) 15%,var(--field));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
  .nd-titles{min-width:0}
  .nd-title{font-family:'Lalezar','Aref Ruqaa',serif;font-size:18.5px;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nd-type{font-size:11px;color:var(--c);font-weight:700;letter-spacing:.3px;opacity:.95}
  .nd-desc{margin:10px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
  .pill svg{color:var(--c)}
  .cta{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;border-radius:12px;font-size:12.5px;font-weight:800;
    color:var(--gold);background:rgba(229,181,75,.08);border:1px dashed rgba(229,181,75,.55)}
  .opt{position:relative;margin:8px -14px 0;padding:9px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
    background:var(--field);border-block:1px solid var(--line)}
  .opt .num{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:11px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
  .port{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--c);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent);transition:transform .2s,box-shadow .2s}
  .node:hover .port,.node.sel .port{transform:scale(1.18);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
  .port.in{right:-9px;top:25px}
  .port.out{left:-9px;top:25px}
  .opt .port.out{top:50%;margin-top:-8px;left:-9px}
  .warn{position:absolute;left:-9px;top:-10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--danger);
    border:2px solid var(--bg);box-shadow:0 6px 14px -4px rgba(244,91,105,.7);z-index:3}
  .warn::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--danger);opacity:.0;animation:pulse 2s ease-out infinite}
  .warn[hidden]{display:none}

  /* ---------- Workspace tools ---------- */
  .tools{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:2px;padding:4px;border-radius:18px;
    background:rgba(11,36,28,.9);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 34px -14px rgba(0,0,0,.8)}
  .tools .ibtn{width:40px;height:40px;border-radius:13px}
  .tools .ibtn.on{background:color-mix(in srgb,var(--brand) 18%,var(--field));color:var(--brand)}
  .tools .tgroup{display:flex;align-items:center;gap:2px}
  .tools.collapsed .tgroup{display:none}
  .zoom-lbl{min-width:52px;text-align:center;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .vsep{width:1px;height:22px;background:var(--line);margin-inline:4px}

  /* ---------- FAB + palette ---------- */
  .fab{position:absolute;z-index:14;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;display:grid;place-items:center;
    background:var(--brand);color:#04130d;box-shadow:0 16px 36px -10px rgba(61,209,137,.75);transition:transform .25s var(--ease),box-shadow .2s}
  .fab:hover{box-shadow:0 18px 44px -8px rgba(61,209,137,.95)}
  .fab svg{transition:transform .3s var(--ease)}
  .fab.open svg{transform:rotate(135deg)}
  .palette{position:absolute;z-index:13;left:18px;bottom:calc(94px + env(safe-area-inset-bottom));width:min(372px,calc(100% - 36px));padding:14px;border-radius:24px;
    background:rgba(11,36,28,.96);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 26px 60px -16px rgba(0,0,0,.85);
    transform-origin:0 100%;transform:scale(.92) translateY(12px);opacity:0;pointer-events:none;transition:transform .25s var(--ease),opacity .2s}
  .palette.open{transform:none;opacity:1;pointer-events:auto}
  .pal-title{font-family:'Lalezar','Aref Ruqaa',serif;font-size:19px;margin:0 4px 10px}
  .pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pal-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;text-align:start;background:var(--field);border:1px solid var(--line);transition:border-color .2s,transform .15s}
  .pal-item:hover{border-color:var(--c)}
  .pal-item:active{transform:scale(.97)}
  .pal-item .nd-ico{width:36px;height:36px;border-radius:12px}
  .pal-item b{display:block;font-size:13.5px}
  .pal-item small{display:block;font-size:11px;color:var(--muted);line-height:1.35}

  .hint{position:absolute;z-index:5;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:44%;font-size:11.5px;line-height:1.6;color:var(--muted);
    padding:8px 12px;border-radius:14px;background:rgba(11,36,28,.7);border:1px solid var(--line);pointer-events:none}
  .hint b{color:var(--gold)}

  /* ---------- Inspector (slide-up on mobile, docked on desktop) ---------- */
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(2,10,7,.55);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.show{opacity:1;pointer-events:auto}
  .inspector{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:72dvh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;
    background:var(--card);border:1px solid var(--line);border-bottom:0;box-shadow:0 -24px 70px rgba(0,0,0,.65);
    transform:translateY(108%);transition:transform .38s var(--ease)}
  .inspector.open{transform:none}
  .grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none;cursor:pointer}
  .insp-head{display:flex;align-items:center;gap:12px;padding:12px 18px 10px;flex:none}
  .insp-head .nd-ico{width:46px;height:46px;border-radius:15px}
  .insp-title{flex:1;min-width:0}
  .insp-title input{width:100%;background:transparent;border:1px solid transparent;border-radius:10px;padding:0 6px;margin:0 -6px;font-family:'Lalezar','Aref Ruqaa',serif;font-size:22px;line-height:1.4}
  .insp-title input:hover{border-color:var(--line)}
  .insp-title input:focus{outline:none;border-color:var(--c);background:var(--field)}
  .insp-title small{display:block;font-size:11.5px;font-weight:700;color:var(--c)}
  .insp-body{overflow:auto;padding:6px 18px 18px;display:grid;gap:18px;align-content:start;overscroll-behavior:contain}
  .insp-foot{flex:none;display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(6,26,20,.5)}
  .insp-foot .btn{flex:1}
  .insp-foot .btn.sq{flex:none;width:46px;padding:0}
  .sec-t{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:13px;font-weight:800;color:#dfeee7}
  .sec-t small{font-weight:500;color:var(--muted);font-size:11.5px}
  .field{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.7;transition:border-color .2s,box-shadow .2s}
  .field::placeholder{color:#5d7469}
  .field:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(61,209,137,.14)}
  .field.invalid{border-color:var(--danger);box-shadow:0 0 0 4px rgba(244,91,105,.12)}
  textarea.field{min-height:104px;resize:vertical}
  .ltr{direction:ltr;text-align:left}
  .row{display:flex;gap:8px;align-items:center}
  .counter{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .counter.max{color:var(--gold)}
  .vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .vars button{padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--brand);background:rgba(61,209,137,.08);border:1px solid rgba(61,209,137,.25)}
  .cta-box{padding:14px;border-radius:18px;background:linear-gradient(180deg,rgba(229,181,75,.07),transparent);border:1px solid rgba(229,181,75,.3);display:grid;gap:10px}
  .cta-box .sec-t{margin:0;color:var(--gold)}
  .err{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--danger);font-weight:700}
  .err[hidden]{display:none}
  .alert{display:grid;gap:6px;padding:12px 14px;border-radius:16px;background:rgba(244,91,105,.08);border:1px solid rgba(244,91,105,.35)}
  .alert[hidden]{display:none}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
  .seg button{padding:9px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
  .seg button.on{background:var(--c);color:#06140f}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper .val{flex:1;text-align:center;font-family:'Lalezar','Aref Ruqaa',serif;font-size:34px;line-height:1.2;color:var(--c)}
  .stepper .val small{font-family:'Tajawal',sans-serif;font-size:13px;color:var(--muted);margin-inline-start:6px}
  .stepper .ibtn{width:48px;height:48px;background:var(--field);border:1px solid var(--line);color:var(--text)}
  .opt-edit{display:flex;gap:8px;align-items:center}
  .opt-edit .field{padding:10px 12px}
  .add-row{width:100%;padding:11px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:13px}
  .add-row:hover{color:var(--brand);border-color:var(--brand)}
  .note{font-size:12px;line-height:1.7;color:var(--muted);padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line)}

  /* Instagram-style preview */
  .ig{padding:16px;border-radius:20px;background:#08130f;border:1px solid var(--line)}
  .ig-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted)}
  .ig-av{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 210deg,#F9CE34,#EE2A7B,#6228D7,#F9CE34);display:grid;place-items:center}
  .ig-av i{width:20px;height:20px;border-radius:50%;background:#08130f;display:block}
  .ig-bubble{max-width:88%;background:#1d2a25;border-radius:20px 20px 20px 6px;overflow:hidden}
  .ig-text{padding:11px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .ig-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-top:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:800;color:#9fe6c3}

  .toast{position:fixed;z-index:60;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:11px 18px;border-radius:999px;background:#0F2E24;border:1px solid var(--line);font-size:13.5px;font-weight:700;box-shadow:0 16px 40px -10px rgba(0,0,0,.8);transition:transform .3s var(--ease),opacity .25s}
  .toast.show{transform:translate(-50%,0);opacity:1}

  @keyframes flow{to{stroke-dashoffset:-32}}
  @keyframes blink{50%{opacity:.35}}
  @keyframes pulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Mobile compaction ---------- */
  .mobile-only{display:inline-flex}
  .desk-only{display:none}
  .mobile-only.btn{height:40px;padding:0 14px;font-size:14px}
  .hint .more{display:none}
  .btn .lbl-d{display:none}
  .status .long{display:none}

  /* ---------- Desktop ---------- */
  @media (min-width:768px){
    .mobile-only{display:none}
    .desk-only{display:inline-flex}
    .hint .more{display:inline}
    .btn .lbl-d{display:inline}
    .status .long{display:inline}
    .status .short{display:none}
    .topbar{display:flex;align-items:center;gap:18px;padding:12px 22px}
    .tb-main{flex:0 1 460px}
    .tb-toggle{display:none}
    .tb-sub-wrap{flex:1;display:block}
    .tb-sub{overflow:visible}
    .tb-sub-in{padding-top:0;justify-content:flex-end}
    .tb-sub-in .push{margin-inline-start:0}
    .topbar.collapsed .tb-sub-wrap{display:block}
    .scrim{display:none}
    .grab{display:none}
    .inspector{top:var(--hdr,64px);bottom:0;right:auto;left:0;width:var(--insp-w);max-height:none;border-radius:0 24px 0 0;border:1px solid var(--line);border-left:0;border-bottom:0;
      transform:translateX(-106%);box-shadow:30px 0 70px rgba(0,0,0,.5)}
    .inspector.open{transform:none}
    body.insp-open .stage-wrap{margin-left:var(--insp-w)}
    .insp-head{padding-top:22px}
    .hint{max-width:none}
  }
</style>
</head>

<body>
<div class="app">

  <!-- ===== Collapsible top bar ===== -->
  <header class="topbar" id="topbar">
    <div class="tb-main">
      <button class="ibtn" id="btnBack" aria-label="رجوع إلى قائمة التدفقات" data-i="arrow" data-s="22"></button>
      <div class="tb-name">
        <span class="tb-cap">تدفق · مسودة</span>
        <input id="flowName" class="name-input" value="ترحيب المتجر — إنستغرام" maxlength="80" aria-label="اسم التدفق">
      </div>

<script>

  arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',

  sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  minus:'<line x1="5" y1="12" x2="19" y2="12"/>'
};
const icon=(n,s=20,sw=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
document.querySelectorAll('[data-i]').forEach(el=>{el.insertAdjacentHTML('afterbegin',icon(el.dataset.i,+el.dataset.s||20))});

/* ============================================================
   Data (demo only — nothing here is saved anywhere)
   ============================================================ */
const TYPES={
  trigger :{label:'المُشغِّل',color:'#3DD189',icon:'bolt',  hint:'يبدأ التدفق'},
  message :{label:'رسالة',   color:'#A78BFA',icon:'message',hint:'نص أو زر رابط'},
  question:{label:'سؤال',    color:'#38BDF8',icon:'help',   hint:'أزرار سريعة'},
  delay   :{label:'انتظار',  color:'#FB923C',icon:'clock',  hint:'تأخير زمني'},
  condition:{label:'شرط',    color:'#E5B54B',icon:'branch', hint:'مسارين أو أكثر'},
  action  :{label:'إجراء',   color:'#F472B6',icon:'tag',    hint:'وسم أو تحويل'},
  random  :{label:'عشوائي',  color:'#2DD4BF',icon:'shuffle',hint:'توزيع الزوار'},
  goto    :{label:'انتقال',  color:'#94A3B8',icon:'goto',   hint:'قفز إلى خطوة'},
  end     :{label:'نهاية',   color:'#8B9E96',icon:'flag',   hint:'إنهاء التدفق'}
};
const ar=n=>Number(n).toLocaleString('ar-EG');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NODES=[
 {id:'n1',type:'trigger',x:1560,y:210,title:'عند وصول رسالة',desc:'قناة إنستغرام · أي رسالة نصية من العميل',chips:[{i:'ig',t:'Instagram'}]},
 {id:'n2',type:'message',x:1270,y:210,title:'رسالة الترحيب',text:'هلا بيك في متجرنا! شلون أكدر أساعدك اليوم؟ 🌿',chips:[{t:'نص'}]},
 {id:'n3',type:'delay',x:980,y:210,title:'انتظار قصير',seconds:30,desc:'يتوقف التدفق قبل الخطوة التالية',chips:[{i:'clock',t:'٣٠ ثانية'}]},
 {id:'n4',type:'question',x:690,y:150,title:'اختر الخدمة',text:'شنو تحب نسوي لك؟',options:['عرض المنتجات','التحدث مع موظف']},
 {id:'n5',type:'message',x:400,y:20,title:'رابط المتجر',text:'تفضّل، هذا رابط المتجر الإلكتروني وفيه كل المنتجات والعروض.',btnLabel:'زيارة الموقع',btnUrl:'http://store.example/shop'},
 {id:'n6',type:'action',x:400,y:300,title:'تحويل إلى موظف',act:'handoff',desc:'تحويل المحادثة للفريق وإيقاف الرد الآلي',chips:[{i:'user',t:'تحويل'}],staticWarn:'يُفضّل إضافة رسالة قبل تحويل المحادثة إلى موظف'},
 {id:'n7',type:'action',x:110,y:20,title:'إضافة وسم',act:'tag',value:'مهتم بالمتجر',desc:'وسم العميل «مهتم بالمتجر»',chips:[{i:'tag',t:'وسم'}]},
 {id:'n8',type:'end',x:110,y:300,title:'نهاية التدفق',desc:'يُغلق التدفق ويعود الرد للوضع الطبيعي'}
];
let EDGES=[['n1','n2'],['n2','n3'],['n3','n4'],['n4:0','n5'],['n4:1','n6'],['n5','n7'],['n6','n8']];
let seq=9, selected=null;

const URL_OK=u=>/^https:\/\/[^\s\/$.?#][^\s]*$/i.test(u||'');
function warnOf(n){
  if(n.type==='message' && n.btnLabel!==undefined){
    if(!n.btnLabel.trim()) return 'نص الزر مطلوب';
    if(!URL_OK(n.btnUrl)) return 'رابط الزر يجب أن يبدأ بـ https';
  }
  return n.staticWarn||null;
}
const descOf=n=>n.type==='message'||n.type==='question'?(n.text||'اكتب نص الرسالة…'):(n.desc||TYPES[n.type].hint);

/* ============================================================
   Rendering
   ============================================================ */
const $=s=>document.querySelector(s);
const stage=$('#stage'), world=$('#world'), wires=$('#wires');
const T=n=>TYPES[n.type];

function nodeHTML(n){
  const t=T(n), isTrig=n.type==='trigger';
  let body=`<p class="nd-desc">${esc(descOf(n))}</p>`;
  if(n.chips&&n.chips.length) body+=`<div class="nd-chips">${n.chips.map(c=>`<span class="pill">${c.i?icon(c.i,12):''}${esc(c.t)}</span>`).join('')}</div>`;
  if(n.btnLabel!==undefined) body+=`<div class="cta" data-cta>${icon('link',14)}<span>${esc(n.btnLabel||'—')}</span></div>`;
  if(n.options) body+=n.options.map((o,i)=>`<div class="opt"><span class="num">${ar(i+1)}</span><span>${esc(o)}</span><span class="port out" data-port="out:${i}"></span></div>`).join('');
  const single=!n.options && n.type!=='end';
  return `<div class="node" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;--c:${t.color}" tabindex="0" role="button" aria-label="${esc(n.title)} — ${t.label}">
    ${isTrig?'':'<span class="port in" data-port="in"></span>'}
    <span class="warn" data-warn title="" hidden>${icon('alert',13,2.4)}</span>
    <div class="nd-head"><span class="nd-ico">${icon(t.icon,21)}</span>
      <div class="nd-titles"><div class="nd-title">${esc(n.title)}</div><div class="nd-type">${t.label}</div></div></div>
    ${body}
    ${single?'<span class="port out" data-port="out"></span>':''}
  </div>`;
}
function renderNode(n){
  let el=world.querySelector(`.node[data-id="${n.id}"]`);
  const html=nodeHTML(n);
  if(!el){ world.insertAdjacentHTML('beforeend',html); el=world.querySelector(`.node[data-id="${n.id}"]`); }
  else { const tmp=document.createElement('div'); tmp.innerHTML=html; const nw=tmp.firstElementChild; nw.className=el.className; el.replaceWith(nw); el=nw; }
  refreshWarn(n);
  return el;
}
function refreshWarn(n){
  const el=world.querySelector(`.node[data-id="${n.id}"]`); if(!el) return;
  const w=warnOf(n), b=el.querySelector('[data-warn]');
  b.hidden=!w; b.title=w||''; b.setAttribute('aria-label',w?('تحذير: '+w):'');
  updateWarnChip();
}
function updateWarnChip(){
  const c=NODES.filter(n=>warnOf(n)).length, chip=$('#warnChip');
  chip.hidden=!c; $('#warnTxt').textContent=ar(c)+(c===1?' تحذير':c===2?' تحذيران':' تحذيرات');
}
function renderAll(){
  world.querySelectorAll('.node').forEach(e=>e.remove());
  NODES.forEach(renderNode);
  drawWires();
}

/* ---------- Curved wires (RTL: flow leaves a node on its left, enters the next on its right) ---------- */
function portPos(el,wr){const r=el.getBoundingClientRect();return{x:(r.left+r.width/2-wr.left)/view.s,y:(r.top+r.height/2-wr.top)/view.s}}
function drawWires(){
  const wr=world.getBoundingClientRect(); let defs='',paths='';
  EDGES.forEach(([from,to],i)=>{
    const [fid,fi]=from.split(':'), src=NODES.find(n=>n.id===fid), dst=NODES.find(n=>n.id===to);
    if(!src||!dst) return;
    const se=world.querySelector(`.node[data-id="${fid}"]`), de=world.querySelector(`.node[data-id="${to}"]`);
    const sp=se&&se.querySelector(fi!==undefined?`[data-port="out:${fi}"]`:'[data-port="out"]'), dp=de&&de.querySelector('[data-port="in"]');
    if(!sp||!dp) return;
    const a=portPos(sp,wr), b=portPos(dp,wr), dx=Math.max(70,Math.abs(a.x-b.x)*.5);
    const d=`M${a.x} ${a.y} C${a.x-dx} ${a.y}, ${b.x+dx} ${b.y}, ${b.x} ${b.y}`;
    const c1=T(src).color, c2=T(dst).color;
    defs+=`<linearGradient id="g${i}" gradientUnits="userSpaceOnUse" x1="${a.x}" y1="0" x2="${b.x}" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
    paths+=`<path d="${d}" fill="none" stroke="url(#g${i})" stroke-width="9" opacity=".10"/>
            <path d="${d}" fill="none" stroke="url(#g${i})" stroke-width="2.6" stroke-linecap="round"/>
            <path class="wire-flow" d="${d}" fill="none" stroke="#fff" stroke-width="2.4" opacity=".55"/>`;
  });
  wires.innerHTML=`<defs>${defs}</defs>${paths}`;
}

/* ============================================================
   Pan / zoom / drag (pointer events: mouse, touch, pinch)
   ============================================================ */
let view={x:0,y:0,s:1};
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;
  stage.style.backgroundPosition=`${view.x}px ${view.y}px`;
  const g=22*view.s*(view.s<.5?2:1);   // keep the dotted grid calm when zoomed far out
  stage.style.backgroundSize=`${g}px ${g}px`;
  $('#zoomLbl').textContent=ar(Math.round(view.s*100))+'٪';
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function zoomAt(cx,cy,f){
  const r=stage.getBoundingClientRect(), px=cx-r.left, py=cy-r.top, ns=clamp(view.s*f,.28,1.6);
  view.x=px-(px-view.x)*(ns/view.s); view.y=py-(py-view.y)*(ns/view.s); view.s=ns; applyView();
}
function bbox(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  NODES.forEach(n=>{const e=world.querySelector(`.node[data-id="${n.id}"]`); if(!e) return;
    x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+e.offsetWidth);y2=Math.max(y2,n.y+e.offsetHeight)});
  return{x1,y1,x2,y2,w:x2-x1,h:y2-y1};
}
function fit(){
  const r=stage.getBoundingClientRect(), b=bbox(), padX=36, top=76, bottom=104;
  const s=clamp(Math.min((r.width-padX*2)/b.w,(r.height-top-bottom)/b.h),.28,1);
  view.s=s; view.x=(r.width-b.w*s)/2-b.x1*s; view.y=top+((r.height-top-bottom)-b.h*s)/2-b.y1*s; applyView();
}
function focusStart(){
  const r=stage.getBoundingClientRect();
  if(r.width>=768){ fit(); return; }
  const t=NODES[0], b=bbox(), s=.72; view.s=s; view.x=r.width-(t.x+244)*s-14; view.y=(r.height-b.h*s)/2-b.y1*s; applyView();
}
/* smoothly pan so a node is fully visible (above the mobile sheet / beside the docked inspector) */
function revealNode(id){
  const el=world.querySelector(`.node[data-id="${id}"]`); if(!el||!insp.classList.contains('open')) return;
  const sr=stage.getBoundingClientRect(), nr=el.getBoundingClientRect(), mobile=innerWidth<768;
  const top=sr.top+(mobile?12:84), bottom=(mobile?Math.min(sr.bottom,insp.getBoundingClientRect().top):sr.bottom)-(mobile?12:90);
  const left=sr.left+16, right=sr.right-16; let dx=0,dy=0;
  if(nr.left<left||nr.right>right) dx=(left+right)/2-(nr.left+nr.right)/2;
  if(nr.top<top||nr.bottom>bottom) dy=(top+bottom)/2-(nr.top+nr.bottom)/2;
  if(!dx&&!dy) return;
  stage.classList.add('smooth'); view.x+=dx; view.y+=dy; applyView(); setTimeout(()=>stage.classList.remove('smooth'),420);
}

const ptrs=new Map(); let drag=null, pinch=null, moves=[];
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.tools,.fab,.palette,.hint')) return;
  closePalette();
  stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [p,q]=[...ptrs.values()]; pinch={d:Math.hypot(p.x-q.x,p.y-q.y),s:view.s}; drag=null; return;}
  const el=e.target.closest('.node'), n=el&&NODES.find(m=>m.id===el.dataset.id);
  drag={id:e.pointerId,el,n,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,nx:n&&n.x,ny:n&&n.y,moved:false};
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [p,q]=[...ptrs.values()]; const d=Math.hypot(p.x-q.x,p.y-q.y);
    const ns=clamp(pinch.s*d/pinch.d,.28,1.6); zoomAt((p.x+q.x)/2,(p.y+q.y)/2,ns/view.s); return;}
  if(!drag||drag.id!==e.pointerId) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true; (drag.n?drag.el:stage).classList.add(drag.n?'dragging':'grabbing');}
  if(!drag.moved) return;
  if(drag.n){drag.n.x=Math.round(drag.nx+dx/view.s); drag.n.y=Math.round(drag.ny+dy/view.s);
    drag.el.style.left=drag.n.x+'px'; drag.el.style.top=drag.n.y+'px'; drawWires();}
  else {view.x=drag.vx+dx; view.y=drag.vy+dy; applyView();}
});
function endPtr(e){
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(!drag||drag.id!==e.pointerId) return;
  const d=drag; drag=null; stage.classList.remove('grabbing'); d.el&&d.el.classList.remove('dragging');
  if(!d.moved){ d.n? openInspector(d.n.id) : closeInspector(); return; }
  if(d.n){ pushMove({id:d.n.id,from:[d.nx,d.ny],to:[d.n.x,d.n.y]}); markSaved(); }
}
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY<0?1.1:.9)},{passive:false});
stage.addEventListener('keydown',e=>{const el=e.target.closest('.node'); if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); openInspector(el.dataset.id)}});

/* ---------- Workspace tools ---------- */
$('#toolsToggle').onclick=()=>{const c=$('#tools').classList.toggle('collapsed'); $('#toolsToggle').setAttribute('aria-expanded',String(!c))};
$('#toolIn').onclick=()=>{const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1.2)};
$('#toolOut').onclick=()=>{const r=stage.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2)};
$('#toolFit').onclick=fit;
$('#toolPan').onclick=e=>{const b=e.currentTarget, on=b.classList.toggle('on'); b.setAttribute('aria-pressed',String(on)); stage.style.cursor=on?'grab':'default'};

/* ---------- Top bar ---------- */
$('#tbToggle').onclick=()=>{const c=$('#topbar').classList.toggle('collapsed'); $('#tbToggle').setAttribute('aria-expanded',String(!c))};
$('#flowName').addEventListener('input',()=>markSaved());
document.querySelectorAll('.js-publish').forEach(b=>b.onclick=()=>{const c=NODES.filter(warnOf).length; toast(c?'لا يمكن النشر قبل حل '+ar(c)+' تحذير':'جاهز للنشر ✓ (نموذج تصميمي فقط)')});
/* header height → docked inspector sits below it on desktop */
const setHdr=()=>document.documentElement.style.setProperty('--hdr',$('#topbar').offsetHeight+'px');
$('#btnPreview').onclick=()=>toast('المعاينة غير متاحة في النموذج');
$('#btnBack').onclick=()=>toast('رجوع إلى قائمة التدفقات');
$('#warnChip').onclick=()=>{const n=NODES.find(warnOf); if(n){openInspector(n.id)}};

/* ---------- Save status + 2-step undo/redo (demo of node moves) ---------- */
const SAVED_HTML='<span class="long">تم الحفظ تلقائيًا</span><span class="short">محفوظ</span>';
let saveT; function markSaved(){
  const s=$('#saveStatus'); s.classList.add('saving'); $('#saveTxt').textContent='جارٍ الحفظ…';
  clearTimeout(saveT); saveT=setTimeout(()=>{s.classList.remove('saving'); $('#saveTxt').innerHTML=SAVED_HTML},900);
}
let undoSt=[], redoSt=[];
function syncHist(){$('#btnUndo').disabled=!undoSt.length; $('#btnRedo').disabled=!redoSt.length}
function pushMove(m){undoSt.push(m); if(undoSt.length>2) undoSt.shift(); redoSt=[]; syncHist()}
function applyMove(m,to){const n=NODES.find(x=>x.id===m.id); if(!n) return; n.x=to[0]; n.y=to[1];
  const el=world.querySelector(`.node[data-id="${n.id}"]`); el.style.left=n.x+'px'; el.style.top=n.y+'px'; drawWires(); markSaved()}
$('#btnUndo').onclick=()=>{const m=undoSt.pop(); if(!m) return; applyMove(m,m.from); redoSt.push(m); syncHist()};
$('#btnRedo').onclick=()=>{const m=redoSt.pop(); if(!m) return; applyMove(m,m.to); undoSt.push(m); syncHist()};

/* ---------- Palette ---------- */
const PAL=['message','question','delay','condition','action','random','goto','end'];
$('#palGrid').innerHTML=PAL.map(k=>{const t=TYPES[k];return `<button class="pal-item" role="menuitem" data-add="${k}" style="--c:${t.color}">
  <span class="nd-ico" style="--c:${t.color}">${icon(t.icon,19)}</span><span><b>${t.label}</b><small>${t.hint}</small></span></button>`}).join('');
function closePalette(){$('#palette').classList.remove('open'); $('#fab').classList.remove('open'); $('#fab').setAttribute('aria-expanded','false')}
$('#fab').onclick=()=>{const o=$('#palette').classList.toggle('open'); $('#fab').classList.toggle('open',o); $('#fab').setAttribute('aria-expanded',String(o))};
$('#palGrid').addEventListener('click',e=>{const b=e.target.closest('[data-add]'); if(!b) return; addNode(b.dataset.add); closePalette()});
function addNode(type){
  const r=stage.getBoundingClientRect(), cx=(r.width/2-view.x)/view.s-122, cy=(r.height/2-view.y)/view.s-60;
  const n={id:'n'+(seq++),type,x:Math.round(cx),y:Math.round(cy),title:TYPES[type].label,desc:TYPES[type].hint};
  if(type==='message'||type==='question'){n.text=''}
  if(type==='question'){n.options=['الخيار الأول','الخيار الثاني']}
  if(type==='delay'){n.seconds=10;n.chips=[{i:'clock',t:ar(10)+' ثوانٍ'}]}
  if(type==='action'){n.act='tag';n.value=''}
  NODES.push(n); renderNode(n); drawWires(); openInspector(n.id); markSaved(); toast('أُضيفت عقدة «'+TYPES[type].label+'»');
}

/* ============================================================
   Inspector
   ============================================================ */
const insp=$('#inspector'), content=$('#inspContent');
function setSel(id){
  world.querySelectorAll('.node.sel').forEach(e=>e.classList.remove('sel'));
  selected=id; if(id){const el=world.querySelector(`.node[data-id="${id}"]`); el&&el.classList.add('sel')}
}
function openInspector(id){
  const n=NODES.find(x=>x.id===id); if(!n) return;
  setSel(id); renderInspector(n);
  insp.classList.add('open'); insp.setAttribute('aria-hidden','false');
  if(innerWidth<768){
    $('#scrim').classList.add('show');
    const tb=$('#topbar'); if(!tb.classList.contains('collapsed')){tb.classList.add('collapsed'); autoCollapsed=true}   // give the canvas room above the sheet
  } else document.body.classList.add('insp-open');
  closePalette(); clearTimeout(revT); revT=setTimeout(()=>revealNode(id),400);
}
let autoCollapsed=false, revT;
function closeInspector(){
  insp.classList.remove('open'); insp.setAttribute('aria-hidden','true'); $('#scrim').classList.remove('show');
  document.body.classList.remove('insp-open'); setSel(null);
  if(autoCollapsed){$('#topbar').classList.remove('collapsed'); autoCollapsed=false}
}
$('#scrim').onclick=closeInspector; $('#grab').onclick=closeInspector;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeInspector(); closePalette()}});

const counter=(v,max)=>`<span class="counter${v>=max?' max':''}">${ar(v)}/${ar(max)}</span>`;
function igPreview(n){
  const hasBtn=n.btnLabel!==undefined;
  return `<div class="ig"><div class="ig-head"><span class="ig-av"><i></i></span><span>متجرنا · إنستغرام</span></div>
    <div class="ig-bubble"><div class="ig-text" id="pvText">${esc(n.text||'…')}</div>${hasBtn?`<div class="ig-btn" id="pvBtn">${icon('link',15)}<span>${esc(n.btnLabel||'—')}</span></div>`:''}</div></div>`;
}
function renderInspector(n){
  const t=T(n); let body='';
  if(n.type==='trigger'){
    body=`<div><div class="sec-t">القناة</div><div class="seg" style="--c:${t.color}"><button class="on">Instagram</button></div></div>
      <div><div class="sec-t">متى يبدأ التدفق؟</div><div class="seg" style="--c:${t.color}"><button class="on">رسالة واردة</button></div></div>
      <div class="note">الوضع الحالي: رسالة نصية من العميل على إنستغرام.</div>`;
  } else if(n.type==='message'){
    const hasBtn=n.btnLabel!==undefined, w=warnOf(n);
    body=`<div><div class="sec-t">نص الرسالة ${counter((n.text||'').length,640)}</div>
        <textarea class="field" id="fText" maxlength="640" placeholder="اكتب رسالتك للعميل…">${esc(n.text||'')}</textarea>
        <div class="vars"><button data-var="{{الاسم}}">{{الاسم}}</button><button data-var="{{رقم الهاتف}}">{{رقم الهاتف}}</button></div></div>
      ${hasBtn?`<div class="cta-box">
        <div class="sec-t">${icon('link',16)}<span style="flex:1;margin-inline-start:8px">زر رابط (CTA)</span><button class="counter" id="btnRemove" style="color:var(--danger)">إزالة</button></div>
        <div><div class="sec-t" style="font-weight:700;font-size:12px">نص الزر <span id="lblCnt">${counter(n.btnLabel.length,20)}</span></div>
          <input class="field" id="fBtnLabel" maxlength="20" value="${esc(n.btnLabel)}" placeholder="زيارة الموقع"></div>
        <div><div class="sec-t" style="font-weight:700;font-size:12px">رابط الزر</div>
          <input class="field ltr${URL_OK(n.btnUrl)?'':' invalid'}" id="fBtnUrl" inputmode="url" dir="ltr" value="${esc(n.btnUrl||'')}" placeholder="https://"></div>
        <div class="err" id="urlErr" ${URL_OK(n.btnUrl)?'hidden':''}>${icon('alert',15)}<span>رابط الزر يجب أن يبدأ بـ https وأن يكون صالحًا.</span></div>
      </div>`:`<button class="add-row" id="btnAdd">+ إضافة زر رابط</button>`}
      <div><div class="sec-t">معاينة إنستغرام <small>تقريبية</small></div><div id="igWrap">${igPreview(n)}</div></div>`;
  } else if(n.type==='question'){
    body=`<div><div class="sec-t">نص السؤال ${counter((n.text||'').length,640)}</div>
        <textarea class="field" id="fText" maxlength="640" placeholder="اكتب السؤال…">${esc(n.text||'')}</textarea></div>
      <div><div class="sec-t">الخيارات <small>حتى ١٠ · الحد ٢٠ حرفًا</small></div>
        <div style="display:grid;gap:8px" id="optList">${(n.options||[]).map((o,i)=>`<div class="opt-edit"><span class="pill" style="--c:${t.color}">${ar(i+1)}</span><input class="field" maxlength="20" data-opt="${i}" value="${esc(o)}"></div>`).join('')}</div></div>
      <div class="note">كل خيار له منفذ خروج مستقل على العقدة.</div>`;
  } else if(n.type==='delay'){
    body=`<div><div class="sec-t">مدة الانتظار <small>١–٣٠ ثانية</small></div>
        <div class="stepper" style="--c:${t.color}"><button class="ibtn" id="dMinus" aria-label="أقل">${icon('minus',20)}</button>
          <div class="val"><span id="dVal">${ar(n.seconds||10)}</span><small>ثانية</small></div>
          <button class="ibtn" id="dPlus" aria-label="أكثر">${icon('plus',20)}</button></div></div>
      <div class="seg" style="--c:${t.color}"><button data-sec="5">٥ث</button><button data-sec="10">١٠ث</button><button data-sec="30">٣٠ث</button></div>`;
  } else if(n.type==='action'){
    const A=[['tag','وسم'],['untag','إزالة وسم'],['notify','إشعار'],['handoff','تحويل']];
    body=`<div><div class="sec-t">نوع الإجراء</div><div class="seg" style="--c:${t.color}">${A.map(a=>`<button class="${n.act===a[0]?'on':''}" data-act="${a[0]}">${a[1]}</button>`).join('')}</div></div>
      ${(n.act==='tag'||n.act==='untag')?`<div><div class="sec-t">اسم الوسم</div><input class="field" id="fVal" value="${esc(n.value||'')}" placeholder="مثال: مهتم بالمتجر"></div>`:''}
      ${n.act==='handoff'?`<div class="note">يُفضّل إضافة رسالة قبل تحويل المحادثة إلى موظف.</div>`:''}`;
  } else {
    body=`<div class="note">${esc(t.hint)} — خصائص هذه العقدة تظهر هنا.</div>`;
  }
  const w=warnOf(n);
  content.innerHTML=`<div class="insp-head" style="--c:${t.color}">
      <span class="nd-ico" style="--c:${t.color}">${icon(t.icon,24)}</span>
      <div class="insp-title"><input id="fTitle" value="${esc(n.title)}" maxlength="40" aria-label="اسم العقدة"><small>${t.label}</small></div>
      <button class="ibtn" id="inspClose" aria-label="إغلاق">${icon('x',22)}</button></div>
    <div class="insp-body" style="--c:${t.color}">
      <div class="alert" id="alertBox" ${w?'':'hidden'}><div class="err">${icon('alert',16)}<span id="alertTxt">${esc(w||'')}</span></div></div>
      ${body}</div>
    <div class="insp-foot"><button class="btn danger sq" id="btnDel" aria-label="حذف العقدة">${icon('trash',19)}</button>
      <button class="btn ghost sq" id="btnDup" aria-label="تكرار العقدة">${icon('copy',19)}</button>
      <button class="btn primary" id="btnDone">${icon('check',19)}تم</button></div>`;
  bindInspector(n);
}
function syncNode(n){ renderNode(n); const el=world.querySelector(`.node[data-id="${n.id}"]`); if(selected===n.id) el.classList.add('sel'); drawWires(); markSaved();
  const w=warnOf(n); const box=$('#alertBox'); if(box){box.hidden=!w; $('#alertTxt').textContent=w||''} }
function bindInspector(n){
  const q=s=>content.querySelector(s);
  q('#inspClose').onclick=closeInspector; q('#btnDone').onclick=closeInspector;
  q('#fTitle').oninput=e=>{n.title=e.target.value; const el=world.querySelector(`.node[data-id="${n.id}"] .nd-title`); el&&(el.textContent=n.title||'—'); markSaved()};
  q('#btnDel').onclick=()=>{ const i=NODES.indexOf(n); NODES.splice(i,1); EDGES=EDGES.filter(e=>!e.some(x=>x.split(':')[0]===n.id));
    world.querySelector(`.node[data-id="${n.id}"]`).remove(); drawWires(); updateWarnChip(); closeInspector(); markSaved(); toast('حُذفت العقدة') };
  q('#btnDup').onclick=()=>{ const c=JSON.parse(JSON.stringify(n)); c.id='n'+(seq++); c.x+=36; c.y+=36; NODES.push(c); renderNode(c); drawWires(); openInspector(c.id); markSaved(); toast('تم التكرار') };
  const tx=q('#fText'); if(tx){ tx.oninput=e=>{ n.text=e.target.value; const sec=tx.previousElementSibling.querySelector('.counter'); sec.outerHTML=counter(n.text.length,640);
      const d=world.querySelector(`.node[data-id="${n.id}"] .nd-desc`); d&&(d.textContent=descOf(n)); const p=$('#pvText'); p&&(p.textContent=n.text||'…'); markSaved() };
    content.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{ tx.setRangeText(b.dataset.var,tx.selectionStart,tx.selectionEnd,'end'); tx.dispatchEvent(new Event('input')); tx.focus() }); }
  const bl=q('#fBtnLabel'); if(bl){
    bl.oninput=e=>{ n.btnLabel=e.target.value; q('#lblCnt').innerHTML=counter([...n.btnLabel].length,20);
      const c=world.querySelector(`.node[data-id="${n.id}"] [data-cta] span`); c&&(c.textContent=n.btnLabel||'—'); const p=$('#pvBtn span'); p&&(p.textContent=n.btnLabel||'—'); refreshWarn(n); markSaved();
      const w=warnOf(n); $('#alertBox').hidden=!w; $('#alertTxt').textContent=w||'' };
    q('#fBtnUrl').oninput=e=>{ n.btnUrl=e.target.value; const ok=URL_OK(n.btnUrl); e.target.classList.toggle('invalid',!ok); $('#urlErr').hidden=ok; refreshWarn(n); markSaved();
      const w=warnOf(n); $('#alertBox').hidden=!w; $('#alertTxt').textContent=w||'' };
    q('#btnRemove').onclick=()=>{ delete n.btnLabel; delete n.btnUrl; syncNode(n); renderInspector(n) };
  }
  const ba=q('#btnAdd'); if(ba) ba.onclick=()=>{ n.btnLabel='زيارة الموقع'; n.btnUrl='https://'; syncNode(n); renderInspector(n) };
  content.querySelectorAll('[data-opt]').forEach(i=>i.oninput=e=>{ n.options[+i.dataset.opt]=e.target.value;
    const row=world.querySelectorAll(`.node[data-id="${n.id}"] .opt > span:nth-child(2)`)[+i.dataset.opt]; row&&(row.textContent=e.target.value||'—'); markSaved() });
  const setSec=v=>{ n.seconds=clamp(v,1,30); n.chips=[{i:'clock',t:ar(n.seconds)+' ثانية'}]; $('#dVal').textContent=ar(n.seconds); syncNode(n) };
  const dm=q('#dMinus'); if(dm){ dm.onclick=()=>setSec((n.seconds||10)-1); q('#dPlus').onclick=()=>setSec((n.seconds||10)+1);
    content.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>setSec(+b.dataset.sec)) }
  content.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ n.act=b.dataset.act;
    const L={tag:'إضافة وسم',untag:'إزالة وسم',notify:'إرسال إشعار',handoff:'تحويل إلى موظف'}; if(/^(إضافة وسم|إزالة وسم|إرسال إشعار|تحويل إلى موظف)$/.test(n.title)) n.title=L[n.act];
    n.chips=[{i:n.act==='handoff'?'user':'tag',t:{tag:'وسم',untag:'إزالة',notify:'إشعار',handoff:'تحويل'}[n.act]}]; syncNode(n); renderInspector(n) });
  const fv=q('#fVal'); if(fv) fv.oninput=e=>{ n.value=e.target.value; n.desc=(n.act==='untag'?'إزالة الوسم «':'وسم العميل «')+n.value+'»'; const d=world.querySelector(`.node[data-id="${n.id}"] .nd-desc`); d&&(d.textContent=n.desc); markSaved() };
}

/* ---------- Toast ---------- */
let tT; function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- Boot ---------- */
renderAll(); setHdr();
requestAnimationFrame(()=>{setHdr(); focusStart(); drawWires();});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{setHdr(); drawWires()});
addEventListener('resize',()=>{setHdr(); drawWires()});
$('#tbSub').addEventListener('transitionend',setHdr);
</script>
</body>
</html>
